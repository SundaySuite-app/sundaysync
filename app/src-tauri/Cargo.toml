[workspace]

[package]
name = "sundaysync-app"
description = "SundaySync desktop shell. Thin: invokes the engine, renders progress and results."
version = "0.6.0-beta.2"
authors = ["Richard Fossland"]
edition = "2021"
license = "MIT"
repository = "https://github.com/SundaySuite-app/sundaysync"
publish = false

[lib]
name = "sundaysync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The whole engine. Everything worth testing lives here, not in this crate (§3).
sundaysync-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# E9 in-app auto-updater (docs/V02-PROGRAM.md E9). Standard Tauri plugin.
#
# `default-features = false` + `native-tls` for the SAME licensing reason the reqwest
# entry below spells out: the plugin's default is `rustls-tls`, and rustls pulls
# `aws-lc-rs`/`ring`, whose non-SPDX licenses ("OpenSSL", a bare LICENSE file) are NOT
# on deny.toml's allow-list — a rustls-tls updater would fail `cargo deny`. native-tls
# reuses the platform TLS stack already vendored in for `reqwest` (Security.framework
# on macOS, SChannel on Windows, system OpenSSL on the Linux CI runners).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# E7 telemetry (anonymous, consent-gated). `uuid`/`dirs`/`tempfile` are already
# resolved in the tree; naming them directly adds features, not crates.
#
# `reqwest` uses NATIVE-TLS deliberately, NOT the reqwest default. In reqwest 0.13
# `default-tls = ["rustls"]`, and rustls pulls `aws-lc-rs`/`ring`, whose non-SPDX
# licenses ("OpenSSL", a bare LICENSE file) would fail `cargo deny` — deny.toml
# has no `[licenses.clarify]` for them. native-tls' backends (Security.framework
# on macOS, SChannel on Windows, the `openssl` crate on Linux) are all on the
# allow-list. Trade-off: a Linux release build links the system OpenSSL (present
# on the ubuntu CI runners); switch to the `native-tls-vendored` feature if a
# build target lacks it.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
# The `test` feature unlocks `tauri::test::{mock_builder, get_ipc_response}` — a headless
# MockRuntime that drives a command through the REAL invoke pipeline and hands back the
# `InvokeResponseBody` the webview would have received. That is what proves V03-S2's
# binary-IPC claim (D-052) at runtime rather than by reading the IPC bootstrap script, and
# it needs no display, no webview and no ffmpeg — so it runs in every CI job, including
# the deliberately ffmpeg-less macOS/Windows ones (D-005/D-025).
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
