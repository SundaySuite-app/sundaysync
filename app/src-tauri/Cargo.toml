[workspace]

[package]
name = "sundaysync-app"
description = "SundaySync desktop shell. Thin: invokes the engine, renders progress and results."
version = "0.1.2"
authors = ["Richard Fossland"]
edition = "2021"
license = "MIT"
repository = "https://github.com/SundaySuite-app/sundaysync"
publish = false

[lib]
name = "sundaysync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The whole engine. Everything worth testing lives here, not in this crate (§3).
sundaysync-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
