name: Nightly accuracy

# docs/PLAN.md §8.4: "nightly `full` suite". The full tier takes minutes and carries the
# cases the per-push `quick` tier cannot afford — a 10-minute event, five devices, an MP4
# camera file, 4 dB SNR under heavy reverb, drift in both directions.
on:
  schedule:
    # 03:00 UTC — after any evening pushes, before the working day in Norway.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: Full accuracy suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # `--ignored` is what selects the full tier; it is excluded from the push gate on
      # purpose so a slow suite never becomes a reason to stop running CI.
      - name: Full accuracy gate
        run: cargo test -p sundaysync-core --test accuracy -- --ignored --nocapture
        env:
          SUNDAYSYNC_REQUIRE_FFMPEG: "1"

      # docs/V02-PROGRAM.md E4 / §7.7: the peak-RSS memory ceiling. Also `#[ignore]`d off
      # the push gate — it generates a multi-hour synthetic day and samples process RSS
      # for ~3 min, which is a nightly cost, not a per-push one. It proves the D-034
      # single-alloc load() + anchor cache keep a long-reference sync under 4 GB (measured
      # 2.383 GB locally, down from 4.636 GB before the fix).
      - name: Memory ceiling gate (§7.7)
        run: cargo test -p sundaysync-core --test memory_gate -- --ignored --nocapture
        env:
          SUNDAYSYNC_REQUIRE_FFMPEG: "1"
