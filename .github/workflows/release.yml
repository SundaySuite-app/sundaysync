# Build and publish downloadable test installers on a version tag.
#
# Cut a release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag triggers builds on macOS (Apple Silicon) and Windows, and publishes a
# GitHub Release with the installers attached.
#
# ── STATUS: unsigned installers; updater WIRED, activates on the signing secret ─
# Code-signing + notarization are still a follow-up (owner-held Apple certs), so
# these installers are unsigned for now:
#
#   macOS:   Gatekeeper will block the unsigned app. Right-click → Open (once),
#            or: xattr -cr /Applications/SundaySync.app
#   Windows: SmartScreen will warn. "More info" → "Run anyway".
#
# The in-app AUTO-UPDATER is wired (E9, docs/V02-PROGRAM.md): tauri.conf.json
# carries the `plugins.updater` block (pubkey + endpoints) and
# `bundle.createUpdaterArtifacts: true`, and this workflow sets
# `uploadUpdaterJson: true` so `latest.json` ships with every release. The ONE
# missing piece is the CI secret TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) — until
# it exists tauri-action skips updater signing and installed clients reject the
# artifacts (an unsigned update is refused by design). Clients poll the Sunday
# Suite feed at updates.sundaysuite.app/v1/update/sundaysync/{stable,beta}; a
# release is only served once an owner promotes its tag, so publishing here does
# not by itself push anything to anyone.
#
# ffmpeg and ffprobe are BUNDLED as of v0.1.2 (D-031): each runner fetches its
# own SHA-256-pinned pair below, and tauri's `externalBin` places them next to
# the app executable. Testers install nothing.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. An Intel/universal build is a Phase 9
          # follow-up (SundayRec's release does the same and grew universal later).
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Each platform's runner fetches its OWN sidecars — the script reads the host
      # triple from `rustc -vV` and names the files the way `externalBin` expects. Both
      # the downloaded archive and the unpacked binary are SHA-256-pinned, so a moved or
      # altered download fails the build instead of shipping. Run explicitly rather than
      # leaning on the `pretauri` hook, because tauri-action invokes the CLI directly.
      - name: Fetch ffmpeg sidecars
        working-directory: app
        run: node scripts/fetch-ffmpeg.mjs

      # E7 (night finding 10): the telemetry client bakes `builtAt` at COMPILE time via
      # option_env!. Without this the runtime fallback runs in release builds and
      # `builtAt` becomes "when the payload was built" — in-range but untrue, and the
      # Worker's build-age view reads every install as brand new. Epoch millis.
      - name: Stamp telemetry build time
        shell: bash
        run: echo "SUNDAYSYNC_TELEMETRY_BUILT_AT=$(node -e 'console.log(Date.now())')" >> "$GITHUB_ENV"

      # tauri-action builds the bundle, signs the updater artifacts when the signing
      # secret exists, and attaches everything (installers + latest.json) to the release.
      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (E9) — REQUIRED for auto-update to be accepted. Signs
          # latest.json + the per-platform artifacts with the keypair from
          # `npm run tauri signer generate` (the PUBLIC key is in tauri.conf.json).
          # Absent → tauri-action still builds, but the updater artifacts are unsigned
          # and installed clients refuse them. The private key must NEVER be committed;
          # it lives only in Actions secrets. See docs header + the E9 report.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # E7/E8: the telemetry client's compile-time bakes (option_env!). The URL is
          # public infrastructure; the write key is an anti-abuse speed bump minted on the
          # Worker (`WRITE_KEY_SUNDAYSYNC`) and mirrored here as a repo secret. Both ABSENT
          # → the client has no endpoint and sends nothing (fails soft) — exactly the
          # pre-E8-deploy state. Set the secret after the Worker deploy; the next tag then
          # ships a client that can actually deliver its consented payloads.
          SUNDAYSYNC_TELEMETRY_URL: https://telemetry.sundaysuite.app
          SUNDAYSYNC_TELEMETRY_KEY: ${{ secrets.SUNDAYSYNC_TELEMETRY_KEY }}
          # ── macOS code signing (the "damaged / won't open" fix) ─────────────
          # An UNSIGNED downloaded app on modern macOS shows only "appen er
          # skadet" with no Open-Anyway path (ad-hoc + quarantine on Apple
          # Silicon). SundayStage ships CODE-SIGNED with these same three
          # secrets (repo-level there; mirror them onto this repo to activate —
          # tauri-action signs whenever they are present, and skips cleanly
          # while they are absent). Notarization stays disabled suite-wide until
          # the Apple Developer agreement is re-accepted (owner task, same
          # blocker as SundayRec/SundayStage); signed-but-not-notarized gives
          # testers the normal right-click→Open / Open-Anyway path instead of a
          # dead end.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "SundaySync ${{ github.ref_name }}"
          releaseBody: |
            **Usignert installer.** Se README for hva appen gjør.

            **macOS:** Gatekeeper blokkerer usignerte apper. Høyreklikk → Åpne første gang,
            eller kjør `xattr -cr /Applications/SundaySync.app`.
            **Windows:** SmartScreen advarer — «Mer info» → «Kjør likevel».

            **Alt innebygd — ingenting å installere ved siden av.** ffmpeg følger med i
            appen; introduksjonen bekrefter det med en selvtest.

            ---
            **Unsigned installer.** macOS: right-click → Open the first time, or
            `xattr -cr /Applications/SundaySync.app`. Windows: SmartScreen → "More info"
            → "Run anyway". Everything bundled — nothing else to install; the app's
            onboarding self-test confirms it.
          # A `-beta.N` tag ships as a GitHub pre-release; a plain `vX.Y.Z` tag ships as a
          # normal release. The updater feed (the Worker) serves only tags an owner has
          # explicitly promoted, so this flag is only about how github.com labels the
          # release — but a stable release must not be mislabelled a prerelease, hence the
          # tracking rather than the old hardcoded `true`.
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # Ships latest.json (the updater feed manifest) alongside the installers. The
          # input is `uploadUpdaterJson` — the similarly-named `includeUpdaterJson` is NOT
          # a real tauri-action input and is silently ignored (a footgun the sibling app
          # hit). Without this the updater artifacts build but no manifest is published.
          uploadUpdaterJson: true
          # `--bundles nsis` on Windows BETA builds only. MSI's ProductVersion is three
          # numeric fields and cannot express a `-beta.N` suffix — tauri refuses the MSI
          # bundle outright ("pre-release identifier ... must be numeric-only"), which
          # would fail every Windows beta at the bundling step. NSIS is what the updater
          # installs from anyway; stable releases are untouched and still ship both.
          args: ${{ (matrix.platform == 'windows-latest' && contains(github.ref_name, '-beta.')) && '--bundles nsis' || '' }}
