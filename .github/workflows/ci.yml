name: CI

# docs/PLAN.md §8.4: lint + clippy + the `quick` fixture suite on every push. The
# per-platform Tauri bundles are a Phase 9 concern and will live in release.yml; there
# is no frontend to lint until Phase 7, so this workflow is Rust-only for now.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to ffmpeg/ffprobe for every probe and every audio
      # extraction (§4.1, §4.2). Installed from apt here rather than bundled as a
      # sidecar: CI only needs *a* working ffmpeg, while the shipped app bundles its own
      # per-platform binary (§10).
      #
      # NOTE for Phase 3: the runner's ffmpeg version is not pinned, and codec decoder
      # delay is a live accuracy risk (docs/DECISIONS.md D-004). If fixture ground truth
      # ever starts failing only in CI, suspect an ffmpeg version difference here before
      # suspecting the engine.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` is what turns the lint config into a gate. In particular it is
      # what enforces §7.1's ban on `unwrap`/`expect` in crates/core outside tests —
      # verified to actually fire, not merely configured.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SUNDAYSYNC_REQUIRE_FFMPEG turns the tests' "ffprobe unavailable, skipping" path
      # into a hard failure. ffmpeg is installed above, so if those tests ever start
      # skipping here it means the install broke — and a silent skip would otherwise
      # read as a green suite while the entire probe layer went untested.
      # Includes the §8.1 `quick` accuracy suite, which generates fixtures and runs the
      # real extraction + correlation path. The `full` tier is excluded here by
      # `#[ignore]` and runs in nightly.yml.
      - name: Tests
        run: cargo test --workspace
        env:
          SUNDAYSYNC_REQUIRE_FFMPEG: "1"

      # §11 Phase 0 acceptance criterion, asserted rather than assumed.
      - name: CLI help works
        run: cargo run -q -p sundaysync-cli -- sync --help

  # §11 Phase 0 asks for "CI green on all three platforms' checks", while §8.4 specifies
  # the per-push gate as an ubuntu runner (with Win/mac bundles on tags). This job
  # reconciles the two cheaply: the full lint/test gate stays on ubuntu, and macOS +
  # Windows get a compile-and-test pass so platform-specific breakage — path handling,
  # child-process spawning, line endings — surfaces on the commit that caused it rather
  # than at the Phase 9 release build.
  #
  # No ffmpeg is installed here, by choice. The probe tests detect its absence and skip
  # with a printed SKIP line, while the ubuntu job above runs them for real with
  # SUNDAYSYNC_REQUIRE_FFMPEG=1 so the skip can never hide a regression where it counts.
  # This keeps these jobs to ~30 s instead of several minutes of brew/choco. Revisit if
  # a platform-specific decode bug ever slips through. See docs/DECISIONS.md D-005.
  cross-platform:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace

  # The Tauri shell (app/src-tauri) is its own workspace, excluded from the root one
  # (D-023), so `cargo …--workspace` above never sees it. That meant the nine
  # #[tauri::command] functions, the AppState lock handling and the EventSink throttle
  # got zero clippy and zero tests on push — E2's stability explorer flagged it (F16) as
  # the cheapest high-value gap. This job closes it: the shell now gets fmt + clippy +
  # test on every push, which directly guards the sidecar-resolution work E1 added here.
  shell:
    name: Shell (app/src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "app/src-tauri -> target"

      # Tauri needs the system webview + GTK libs to compile on Linux. No ALSA here —
      # unlike SundayRec, this shell has no audio backend of its own; ffmpeg is a sidecar.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # `tauri-build` validates that every `externalBin` file exists — even for a plain
      # `cargo clippy`/`test` that never bundles anything (a known suite gotcha). Fetching
      # the real 130 MB ffmpeg pair on every push just to satisfy an existence check would
      # be wasteful, so stub the two sidecars with the exact target-triple names the
      # config expects. They are never executed by clippy or the shell's unit tests.
      - name: Stub ffmpeg sidecars for the existence check
        run: |
          mkdir -p app/src-tauri/binaries
          triple=x86_64-unknown-linux-gnu
          for bin in ffmpeg ffprobe; do
            printf '#!/bin/sh\nexit 0\n' > "app/src-tauri/binaries/$bin-$triple"
            chmod +x "app/src-tauri/binaries/$bin-$triple"
          done

      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test

  # docs/DECISIONS.md D-093: the built app must LAUNCH and RENDER on the engines it ships on.
  #
  # Every check above this one runs the frontend in headless Chromium with the Tauri IPC
  # mocked (`app/e2e/harness.ts`). The app a user installs runs in WKWebView (macOS) or
  # WebView2 (Windows), which are different engines — and the suite has already shipped a
  # defect that lives only in that gap: SundayEdit's renderer was 42× slower in real
  # WKWebView because its user agent carries no `Safari` token, invisible from Chromium by
  # construction. Until this job existed, nobody had ever launched a SundaySync installer.
  #
  # The gate is the app's own word, not a screen scrape: under `SUNDAYSYNC_SMOKE=1` the shell
  # (app/src-tauri/src/smoke.rs) writes one JSON line once the webview has mounted, carrying
  # the user agent, the root's laid-out box, the element count, `<body>`'s computed
  # background, and every error caught during boot — then exits. A watchdog fails the run if
  # that never happens, which is the case a launched-but-blank app produces and nothing else
  # would catch. No display scraping, no WebDriver (WKWebView has no driver anyway).
  native-smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "app/src-tauri -> target"

      # Which WebView2 runtime the runner has. Printed rather than asserted: the version
      # moves with the image, and the point is to have it in the log next to the user agent
      # when a Windows-only rendering bug eventually shows up.
      - name: WebView2 runtime version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 runtime: $((Get-ItemProperty $key).pv)" }
          else { "WebView2 runtime: not found in the registry (the app may still find it)" }

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The REAL sidecars, not the stubs the `shell` job uses. This is the only check in the
      # repo that runs the app as bundled, so it is also the only one that can see D-031's
      # "ffmpeg travels inside the app" claim fail — the runner treats
      # "ffmpeg could not be resolved at startup" on the app's stderr as a failure.
      - name: Fetch ffmpeg sidecars
        working-directory: app
        run: node scripts/fetch-ffmpeg.mjs

      # macOS: build the .app, because the .app is what a user gets — Info.plist, bundle
      # identifier, sidecars in Contents/MacOS, all of it. `tauri.smoke.conf.json` turns off
      # updater artefacts, which otherwise fail the build outright without the signing key.
      - name: Build the app (macOS bundle)
        if: runner.os == 'macOS'
        working-directory: app
        run: npx tauri build --debug --bundles app --config src-tauri/tauri.smoke.conf.json

      # Windows: no bundling. The NSIS installer's payload IS this exe, and installing it
      # would want UAC and minutes for no extra fidelity.
      - name: Build the app (Windows binary)
        if: runner.os == 'Windows'
        working-directory: app
        run: npx tauri build --debug --no-bundle

      - name: Launch it and prove it rendered
        working-directory: app
        run: node scripts/native-smoke.mjs --out ../native-smoke --hold-ms 5000 --timeout-ms 90000

      # `always()`: the artefacts are at their most useful on the run that FAILED — the
      # report, the app's own stdout/stderr, and a screenshot of whatever was on screen.
      - name: Upload the smoke artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-smoke-${{ matrix.os }}
          path: native-smoke/
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # docs/V02-PROGRAM.md E3 / S-9a: license hygiene + duplicate-dependency visibility +
  # RustSec advisory enforcement, on top of cargo audit above. Two `cargo deny check`
  # invocations because app/src-tauri is its own workspace (D-023) with a much larger
  # dependency tree (Tauri + webview plumbing) than the root engine/CLI workspace;
  # cargo-deny walks up from cwd to find the single repo-root deny.toml, so both reuse
  # it without --config. `-W unmaintained` is required, not cosmetic — see deny.toml's
  # header comment for why (no in-file severity knob for that diagnostic; actual
  # vulnerabilities stay hard errors regardless of this flag).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check (root workspace)
        run: cargo deny check -W unmaintained
      - name: cargo deny check (app/src-tauri workspace)
        working-directory: app/src-tauri
        run: cargo deny check -W unmaintained

  # docs/V02-PROGRAM.md E3 / S-9b: npm audit alongside cargo audit/deny above.
  #
  # `--omit=dev` gates the SHIPPED dependency tree, not the build/test tooling. This is a
  # deliberate scoping decision (conductor, E3): the current advisories all live in the
  # vitest → vite → esbuild/nanoid DEV chain (vitest-UI arbitrary-file-read, vite
  # dev-server path traversal, nanoid loop) — none of it reaches the Tauri bundle a user
  # runs, and `npm audit --omit=dev` reports zero. Their only fix is a semver-major
  # vitest bump, tracked as a follow-up rather than blocking every push on tooling that
  # never ships. A `high`-or-worse advisory in an ACTUAL runtime dependency still fails
  # this job, which is the point. The full dev audit is run separately below, non-blocking,
  # so the dev advisories stay visible.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: npm audit (shipped dependencies)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev tree, informational)
        working-directory: app
        run: npm audit --audit-level=high || true

  # docs/V02-PROGRAM.md E10: the Playwright QA harness drives the real frontend with the
  # Tauri IPC mocked (the __TAURI_INTERNALS__ shim), so onboarding/consent/scan/sync/export/
  # settings flows are gated headlessly without the Rust shell. Its own tsconfig
  # (app/e2e/tsconfig.json) since the root one only includes src.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      # The three gates every stage of this app has run locally since v0.3 and CI never did:
      # `vitest` covers the pure timeline/audio math (450+ cases — hop arithmetic, the
      # recording-time ladder, schedule planning), `typecheck` covers src (only e2e was
      # checked), and `build` is the one that proves the app still compiles for release.
      # Without them the whole unit suite could go red on a push that CI called green.
      - name: Typecheck src
        working-directory: app
        run: npm run typecheck
      - name: Typecheck e2e
        working-directory: app
        run: npm run typecheck:e2e
      - name: Unit tests
        working-directory: app
        run: npm test
      - name: Production build
        working-directory: app
        run: npm run build
      - name: Run Playwright specs
        working-directory: app
        run: npm run e2e
