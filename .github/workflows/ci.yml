name: CI

# docs/PLAN.md §8.4: lint + clippy + the `quick` fixture suite on every push. The
# per-platform Tauri bundles are a Phase 9 concern and will live in release.yml; there
# is no frontend to lint until Phase 7, so this workflow is Rust-only for now.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The engine shells out to ffmpeg/ffprobe for every probe and every audio
      # extraction (§4.1, §4.2). Installed from apt here rather than bundled as a
      # sidecar: CI only needs *a* working ffmpeg, while the shipped app bundles its own
      # per-platform binary (§10).
      #
      # NOTE for Phase 3: the runner's ffmpeg version is not pinned, and codec decoder
      # delay is a live accuracy risk (docs/DECISIONS.md D-004). If fixture ground truth
      # ever starts failing only in CI, suspect an ffmpeg version difference here before
      # suspecting the engine.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` is what turns the lint config into a gate. In particular it is
      # what enforces §7.1's ban on `unwrap`/`expect` in crates/core outside tests —
      # verified to actually fire, not merely configured.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # §11 Phase 0 acceptance criterion, asserted rather than assumed.
      - name: CLI help works
        run: cargo run -q -p sundaysync-cli -- sync --help

  # §11 Phase 0 asks for "CI green on all three platforms' checks", while §8.4 specifies
  # the per-push gate as an ubuntu runner (with Win/mac bundles on tags). This job
  # reconciles the two cheaply: the full lint/test gate stays on ubuntu, and macOS +
  # Windows get a compile-and-test pass so platform-specific breakage — path handling,
  # child-process spawning, line endings — surfaces on the commit that caused it rather
  # than at the Phase 9 release build.
  #
  # NOTE for Phase 1: no ffmpeg is installed here, because Phase 0's tests are pure. The
  # moment a test shells out to ffmpeg/ffprobe, this job needs per-OS provisioning
  # (brew / choco) or those tests must take a documented skip path on non-ubuntu.
  cross-platform:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
