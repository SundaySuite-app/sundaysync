[package]
name = "sundaysync-fixturegen"
description = "Deterministic synthetic test-media generator for SundaySync. Builds multicamera test shoots with known ground truth. Development tool, not shipped."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "sundaysync_fixturegen"
path = "src/lib.rs"

[[bin]]
name = "fixturegen"
path = "src/main.rs"

# Deliberately does NOT depend on sundaysync-core: fixture generation must not be
# able to inherit a bug from the engine it exists to test. The dependency runs the
# other way — core dev-depends on this for its accuracy harness.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
